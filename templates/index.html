<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Cloner</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input, textarea, button { width: 100%; margin-top: 15px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎤 AI Voice Cloner</h2>
    <p>Apni aawaz upload karein aur naya text likhein!</p>
    
    <form action="/clone" method="POST" enctype="multipart/form-data">
        <label for="audio">1. Original Vocal Upload Karein (MP3/WAV):</label>
        <input type="file" name="audio" id="audio" accept="audio/*" required>
        
        <label for="text">2. Nayi Line Likhein:</label>
        <textarea name="text" id="text" rows="4" placeholder="Wo text likhein jo aap is aawaz se bulwana chahte hain..." required></textarea>
        
        <button type="submit">Generte Audio</button>
    </form>
</div>

</body>
</html>
